<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hosting Station</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-card {
            background: #ffffff;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(142, 68, 173, 0.15);
            text-align: center;
            max-width: 440px;
            width: 85%;
        }
        .status-pill {
            background-color: #8e44ad;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 {
            color: #4a148c;
            font-size: 22px;
            margin-bottom: 15px;
        }
        p {
            color: #7b1fa2;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .profile-area {
            background-color: #faf5ff;
            border: 1px dashed #d1c4e9;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            color: #4a148c;
            margin-top: 15px;
        }
        .time-box {
            font-weight: bold;
            color: #9c27b0;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <span class="status-pill">Vercel Web Test</span>
        <h1>Deployment Web Statis Berhasil!</h1>
        <p>Website ini berhasil berjalan di Vercel</p>
        
        <div class="profile-area">
            <strong>Identitas Praktikan:</strong>
            <div style="margin-top: 5px;">Farisya Lucy Aulia - 102042430010</div>
            <div style="margin-top: 15px; font-size: 12px; color: #6a1b9a;">Waktu Sekarang:</div>
            <div id="live-clock" class="time-box">Memuat waktu...</div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false
            };
            // Format Indonesia: DD/MM/YYYY, HH.MM.SS
            let formattedTime = now.toLocaleString('id-ID', options).replace(',', '');
            document.getElementById('live-clock').innerText = formattedTime;
        }
        // Jalankan fungsi setiap 1 detik agar jam terus berjalan
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
